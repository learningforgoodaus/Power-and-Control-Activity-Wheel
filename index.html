<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power and Control Wheel Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import Inter font for a clean, modern look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F6F5F8; /* Requested background color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            padding-top: 80px; /* Space for the fixed header */
        }

        /* Styling for the main heading */
        .main-header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 0 0.5rem 0;
            text-align: center;
            font-size: 1.875rem; /* 3xl */
            font-weight: 700; /* bold */
            color: #413659; /* BRAND COLOR: Darker Deep Purple */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            z-index: 20;
        }

        /* Main container for the entire activity */
        .learning-activity-container {
            position: relative;
            width: 800px;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Styling for the large central circle */
        .large-circle {
            width: 400px;
            height: 400px;
            background-color: #C6B4D9; /* BRAND COLOR: Light Purple/Lavender */
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.5s ease-in-out;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #413659; /* BRAND COLOR: Darker Deep Purple */
            line-height: 1.6;
            box-sizing: border-box;
            border: 5px solid #9C7F9D; /* BRAND COLOR: Muted Rose/Mauve */
        }

        .large-circle-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-y: auto;
        }

        /* Override general paragraph style for list context */
        .large-circle-content p {
            font-size: 1.05rem;
            font-weight: 500;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin: 0;
        }
        
        .large-circle-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* Wrapper for small circles, positioned to cover the main container */
        #small-circles-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Styling for individual small circles (Spokes) */
        .small-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #513873; /* BRAND COLOR: Deep Purple */
            color: #F6F5F8; /* Off-white text */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.7s ease-in-out,
                        width 0.3s ease-in-out, height 0.3s ease-in-out,
                        border 0.3s ease-in-out, color 0.3s ease-in-out,
                        background-color 0.3s ease-in-out;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 5px;
            box-sizing: border-box;
            line-height: 1.2;
        }

        /* Styling for the active (clicked) small circle */
        .small-circle.active {
            width: 120px;
            height: 120px;
            border: 5px solid #413659; /* BRAND COLOR: Darker Deep Purple for strong contrast border */
            background-color: #C6B4D9; /* BRAND COLOR: Light Purple/Lavender for active fill */
            color: #513873; /* BRAND COLOR: Deep Purple for active text */
            z-index: 10;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transform: scale(1.1);
        }

        /* --- MOBILE ONLY STYLES --- */
        @media (max-width: 768px) {
            .main-header { font-size: 1.3rem; padding: 1rem 0 0.5rem 0; }
            body { padding-top: 60px; }
            .learning-activity-container { width: 100vw; height: 100vw; }

            /* Text Circle at 90vw */
            .large-circle {
                width: 90vw;
                height: 90vw;
                padding: 25px;
                top: 60%; /* Lowered to fit the top arc */
            }

            .large-circle-content p { font-size: 0.9rem; }
            .large-circle-content h2 { font-size: 1.1rem; }

            /* Small circle adjustments for mobile */
            .small-circle { width: 13vw; height: 13vw; }
            .small-circle.active { width: 16vw; height: 16vw; }

            /* Hide small circle text titles, only show number centered */
            .circle-title { display: none; }
            .circle-number { font-size: 1.3rem !important; }
        }
    </style>
</head>
<body>
    <header class="main-header">
        Tactics used to gain power and control
    </header>

    <div class="learning-activity-container">
        <div id="large-circle" class="large-circle">
            <div class="large-circle-content">
                <h2 id="large-circle-title"></h2>
                <p id="large-circle-text"></p>
            </div>
        </div>
        <div id="small-circles-wrapper"></div>
    </div>

    <script>
        const sectionsData = [
            { id: 'coercion', title: 'Using Coercion & Threats', content: 'Making and/or carrying out threats to hurt them, threatening to leave them, to commit suicide, or to report them to welfare, forcing them to drop charges, or making them do illegal things.' },
            { id: 'intimidation', title: 'Using Intimidation', content: 'Making them scared by using looks, actions, or gestures, smashing things, destroying their property, abusing pets, or showing weapons.' },
            { id: 'emotional', title: 'Using Emotional Abuse', content: 'Putting them down, making them feel bad about themselves, calling them names, making them think they\'re crazy, playing mind games, humiliating them, or making them feel guilty.' },
            { id: 'isolation', title: 'Using Isolation', content: 'Controlling what they do, who they see and talks to, what they read, or where they go, limiting their involvement with others, or using jealousy to excuse these actions.' },
            { id: 'minimize', title: 'Minimising Denying & Blaming', content: 'Making light of the abuse and not taking their worries seriously, saying the abuse didn\'t happen, shifting responsibility for abusive behaviour, or saying they caused it.' },
            { id: 'children', title: 'Using Children', content: 'Making them feel guilty about the children, using the children to pass on messages, using visitation to harass them, or threatening to take the children away.' },
            { id: 'privilege', title: 'Using Male Privilege', content: 'Treating them like a servant, making all the big decisions, acting like the master of the house, or defining what gender roles should be.' },
            { id: 'economic', title: 'Using Economic Abuse', content: 'Stopping them from getting or keeping a job, making them ask for money, giving them an allowance, taking their money, or not letting them know about or access family income.' }
        ];

        const introData = {
            title: 'POWER AND CONTROL',
            content: 'Select the outer circles to reveal information.'
        };

        const largeCircleTitle = document.getElementById('large-circle-title');
        const largeCircleText = document.getElementById('large-circle-text');
        const smallCirclesWrapper = document.getElementById('small-circles-wrapper');
        const learningActivityContainer = document.querySelector('.learning-activity-container');

        let activeCircleId = null; 

        const BASE_CONTAINER_WIDTH = 800;
        const LARGE_CIRCLE_DIAMETER_PX = 400;
        const SMALL_CIRCLE_DIAMETER_PX = 100;
        const ACTIVE_SMALL_CIRCLE_DIAMETER_PX = 120;
        const PADDING_FROM_LARGE_CIRCLE = 60;

        function renderCircles() {
            const isMobile = window.innerWidth <= 768;
            const containerCenterX = learningActivityContainer.offsetWidth / 2;
            const containerCenterY = learningActivityContainer.offsetHeight / 2;
            const activeSectionIndex = sectionsData.findIndex(s => s.id === activeCircleId);

            sectionsData.forEach((section, index) => {
                const circleElement = document.getElementById(`circle-${section.id}`);
                const isActive = section.id === activeCircleId;
                let x, y, currentCircleDiameter;

                if (!isMobile) {
                    /* ORIGINAL PC LOGIC UNCHANGED */
                    currentCircleDiameter = isActive ? ACTIVE_SMALL_CIRCLE_DIAMETER_PX : SMALL_CIRCLE_DIAMETER_PX;
                    const orbitRadius = (LARGE_CIRCLE_DIAMETER_PX / 2) + (SMALL_CIRCLE_DIAMETER_PX / 2) + PADDING_FROM_LARGE_CIRCLE;
                    let targetAngleDegrees;

                    if (index <= activeSectionIndex) {
                        targetAngleDegrees = 135 + (index * 30);
                    } else {
                        const relativeIndexOnRight = index - (activeSectionIndex + 1);
                        targetAngleDegrees = 45 - (relativeIndexOnRight * 30);
                        if (targetAngleDegrees < 0) targetAngleDegrees += 360;
                    }

                    const rad = targetAngleDegrees * (Math.PI / 180);
                    x = containerCenterX + orbitRadius * Math.cos(rad) - (currentCircleDiameter / 2);
                    y = containerCenterY - orbitRadius * Math.sin(rad) - (currentCircleDiameter / 2);
                } else {
                    /* MOBILE TOP ARC LOGIC */
                    currentCircleDiameter = isActive ? (window.innerWidth * 0.16) : (window.innerWidth * 0.13);
                    const arcWidth = window.innerWidth * 0.85;
                    const step = arcWidth / (sectionsData.length - 1);
                    const startX = (window.innerWidth - arcWidth) / 2;
                    
                    x = startX + (index * step) - (currentCircleDiameter / 2);
                    y = 120 - Math.sin((index / (sectionsData.length - 1)) * Math.PI) * 40 - (currentCircleDiameter / 2);
                }

                circleElement.style.transform = `translate(${x}px, ${y}px)`;
                circleElement.style.width = `${currentCircleDiameter}px`;
                circleElement.style.height = `${currentCircleDiameter}px`;
                circleElement.classList.toggle('active', isActive);
            });
        }

        function handleCircleClick(event) {
            const clickedId = event.currentTarget.dataset.id;
            if (activeCircleId === clickedId) {
                activeCircleId = null; 
                largeCircleTitle.textContent = introData.title.toUpperCase();
                largeCircleText.textContent = introData.content;
            } else {
                activeCircleId = clickedId;
                const section = sectionsData.find(s => s.id === clickedId);
                const num = sectionsData.indexOf(section) + 1;
                largeCircleTitle.textContent = `${num}. ${section.title}`.toUpperCase();
                largeCircleText.textContent = section.content;
            }
            renderCircles();
        }

        function init() {
            sectionsData.forEach((section, index) => {
                const circleDiv = document.createElement('div');
                circleDiv.classList.add('small-circle');
                circleDiv.id = `circle-${section.id}`;
                circleDiv.dataset.id = section.id;
                circleDiv.innerHTML = `
                    <div style="text-align: center;">
                        <span class="circle-number" style="font-weight: 700;">${index + 1}</span>
                        <div class="circle-title" style="font-size: 0.9em; font-weight: 600; line-height: 1.1;">${section.title.replace(/ /g, '<br/>')}</div>
                    </div>
                `;
                circleDiv.addEventListener('click', handleCircleClick);
                smallCirclesWrapper.appendChild(circleDiv);
            });

            largeCircleTitle.textContent = introData.title.toUpperCase();
            largeCircleText.textContent = introData.content;
            renderCircles();
            window.addEventListener('resize', renderCircles);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
