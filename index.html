<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power and Control Wheel Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F6F5F8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            padding-top: 80px;
        }

        .main-header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 0 0.5rem 0;
            text-align: center;
            font-size: 1.875rem;
            font-weight: 700;
            color: #413659;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            z-index: 50;
        }

        .learning-activity-container {
            position: relative;
            width: 800px;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .large-circle {
            width: 400px;
            height: 400px;
            background-color: #C6B4D9;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.5s ease-in-out;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #413659;
            line-height: 1.6;
            box-sizing: border-box;
            border: 5px solid #9C7F9D;
            z-index: 10;
        }

        .large-circle-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-y: auto;
        }

        .large-circle-content p {
            font-size: 1.05rem;
            font-weight: 500;
            margin: 0;
        }
        
        .large-circle-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .small-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #513873;
            color: #F6F5F8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            z-index: 20;
        }

        .small-circle.active {
            background-color: #C6B4D9;
            color: #513873;
            border: 4px solid #413659;
            transform: scale(1.1);
        }

        /* MOBILE STYLES: Top Arc Navigation */
        @media (max-width: 768px) {
            .main-header { font-size: 1.1rem; padding: 1rem 0.5rem; }
            
            .learning-activity-container {
                width: 100vw;
                height: 100vh;
                align-items: flex-end; /* Push circle down slightly */
                padding-bottom: 10vh;
            }

            .large-circle {
                width: 90vw;
                height: 90vw;
                padding: 30px;
                top: 60%; /* Positioned lower to make room for the arc */
            }

            .large-circle-content p { font-size: 0.9rem; line-height: 1.4; }
            .large-circle-content h2 { font-size: 1rem; margin-bottom: 5px; }

            /* Hide titles, only show numbers in the arc */
            .circle-title { display: none; }
            .circle-number { font-size: 1.2rem !important; }

            .small-circle {
                width: 12vw;
                height: 12vw;
            }
            
            .small-circle.active {
                width: 14vw;
                height: 14vw;
            }
        }
    </style>
</head>
<body>
    <header class="main-header">
        Tactics used to gain power and control
    </header>

    <div class="learning-activity-container">
        <div id="large-circle" class="large-circle">
            <div class="large-circle-content">
                <h2 id="large-circle-title"></h2>
                <p id="large-circle-text"></p>
            </div>
        </div>
        <div id="small-circles-wrapper"></div>
    </div>

    <script>
        const sectionsData = [
            { id: 'coercion', title: 'Using Coercion & Threats', content: 'Making and/or carrying out threats to hurt them, threatening to leave them, to commit suicide, or to report them to welfare, forcing them to drop charges, or making them do illegal things.' },
            { id: 'intimidation', title: 'Using Intimidation', content: 'Making them scared by using looks, actions, or gestures, smashing things, destroying their property, abusing pets, or showing weapons.' },
            { id: 'emotional', title: 'Using Emotional Abuse', content: 'Putting them down, making them feel bad about themselves, calling them names, making them think they\'re crazy, playing mind games, humiliating them, or making them feel guilty.' },
            { id: 'isolation', title: 'Using Isolation', content: 'Controlling what they do, who they see and talks to, what they read, or where they go, limiting their involvement with others, or using jealousy to excuse these actions.' },
            { id: 'minimize', title: 'Minimising Denying & Blaming', content: 'Making light of the abuse and not taking their worries seriously, saying the abuse didn\'t happen, shifting responsibility for abusive behaviour, or saying they caused it.' },
            { id: 'children', title: 'Using Children', content: 'Making them feel guilty about the children, using the children to pass on messages, using visitation to harass them, or threatening to take the children away.' },
            { id: 'privilege', title: 'Using Male Privilege', content: 'Treating them like a servant, making all the big decisions, acting like the master of the house, or defining what gender roles should be.' },
            { id: 'economic', title: 'Using Economic Abuse', content: 'Stopping them from getting or keeping a job, making them ask for money, giving them an allowance, taking their money, or not letting them know about or access family income.' }
        ];

        const introData = { title: 'POWER AND CONTROL', content: 'Select the numbers above to reveal the tactics used to gain control.' };

        const largeCircleTitle = document.getElementById('large-circle-title');
        const largeCircleText = document.getElementById('large-circle-text');
        const smallCirclesWrapper = document.getElementById('small-circles-wrapper');
        const container = document.querySelector('.learning-activity-container');

        let activeCircleId = null; 

        function render() {
            const isMobile = window.innerWidth <= 768;
            const centerX = container.offsetWidth / 2;
            const centerY = container.offsetHeight / 2;
            
            // Logic for Desktop: Dynamic Orbiting Wheel
            if (!isMobile) {
                const orbitRadius = 280; 
                const activeIndex = sectionsData.findIndex(s => s.id === activeCircleId);

                sectionsData.forEach((section, index) => {
                    const el = document.getElementById(`circle-${section.id}`);
                    const isActive = section.id === activeCircleId;
                    const size = isActive ? 120 : 100;
                    
                    let angle;
                    if (activeIndex === -1) {
                        angle = (45 - (index * 30)) * (Math.PI / 180);
                    } else if (index <= activeIndex) {
                        angle = (135 + (index * 30)) * (Math.PI / 180);
                    } else {
                        angle = (45 - ((index - (activeIndex + 1)) * 30)) * (Math.PI / 180);
                    }

                    const x = centerX + orbitRadius * Math.cos(angle) - (size / 2);
                    const y = centerY - orbitRadius * Math.sin(angle) - (size / 2);
                    
                    el.style.transform = `translate(${x}px, ${y}px)`;
                    el.style.width = `${size}px`;
                    el.style.height = `${size}px`;
                    el.classList.toggle('active', isActive);
                });
            } 
            // Logic for Mobile: Top Arc
            else {
                const arcRadius = window.innerWidth * 0.45;
                const startAngle = 170; // Left side of arc
                const endAngle = 10;    // Right side of arc
                const step = (startAngle - endAngle) / (sectionsData.length - 1);

                sectionsData.forEach((section, index) => {
                    const el = document.getElementById(`circle-${section.id}`);
                    const isActive = section.id === activeCircleId;
                    const size = isActive ? (window.innerWidth * 0.16) : (window.innerWidth * 0.13);
                    
                    const angleRad = (startAngle - (index * step)) * (Math.PI / 180);
                    
                    // Positions relative to top of screen
                    const x = centerX + (arcRadius * Math.cos(angleRad)) - (size / 2);
                    const y = 130 - (Math.sin(angleRad) * 40) - (size / 2); // Creates the slight curve
                    
                    el.style.transform = `translate(${x}px, ${y}px)`;
                    el.style.width = `${size}px`;
                    el.style.height = `${size}px`;
                    el.classList.toggle('active', isActive);
                });
            }
        }

        function handleBtnClick(id) {
            if (activeCircleId === id) {
                activeCircleId = null;
                largeCircleTitle.textContent = introData.title;
                largeCircleText.textContent = introData.content;
            } else {
                activeCircleId = id;
                const data = sectionsData.find(s => s.id === id);
                const num = sectionsData.indexOf(data) + 1;
                largeCircleTitle.textContent = `${num}. ${data.title}`.toUpperCase();
                largeCircleText.textContent = data.content;
            }
            render();
        }

        function init() {
            sectionsData.forEach((section, index) => {
                const div = document.createElement('div');
                div.className = 'small-circle';
                div.id = `circle-${section.id}`;
                div.dataset.id = section.id;
                div.innerHTML = `
                    <div class="text-center">
                        <span class="circle-number text-lg font-bold">${index + 1}</span>
                        <div class="circle-title text-[10px] leading-tight mt-1 px-1">${section.title.replace(/ /g, '<br>')}</div>
                    </div>
                `;
                div.onclick = () => handleBtnClick(section.id);
                smallCirclesWrapper.appendChild(div);
            });

            largeCircleTitle.textContent = introData.title;
            largeCircleText.textContent = introData.content;
            render();
            window.onresize = render;
        }

        init();
    </script>
</body>
</html>
